spring.profiles.active=local
build.time=@current.time@

spring.application.name=bcdt-ops
server.port=11010



# \u7985\u9053\u6570\u636E\u5E93\u5B57\u6BB5\u52A0\u89E3\u5BC6\u5BC6\u94A5\uFF0C\u6700\u4F73\u65B9\u6848\u901A\u8FC7\u542F\u52A8\u811A\u672C\u8BBE\u7F6E
crypto-key=95825e5cd53cb00c4fb10e6457c460b8


# \u5141\u8BB8\u8DE8\u57DF
cross.domain.enabled=false


#spring
server.servlet.context-path=/
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent_output=false
spring.jackson.serialization.fail_on_empty_beans=false


#\u65E5\u5FD7 \u76F8\u5BF9\u4E8E\u6267\u884C\u542F\u52A8\u811A\u672C\u7684\u76EE\u5F55
logging.file.path=./logs
logging.config=classpath:config/logback-spring.xml
logging.level.root=warn
logging.level.org.springframework.web=error

#tomcat \u8BBF\u95EE\u65E5\u5FD7
server.tomcat.basedir=./tomcat
server.tomcat.accesslog.directory=../logs
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.buffered=true
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.accesslog.pattern=%{yyyy-MM-dd HH:mm:ss.SSS}t;%a[%{x-forwarded-for}i];%m;%U;%s;%{ms}T
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.rename-on-rotate=true
server.tomcat.accesslog.request-attributes-enabled=true
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.suffix=.csv







# ===============================
# MyBatis-Plus \u914D\u7F6E
# ===============================
# Mapper XML \u6587\u4EF6\u8DEF\u5F84
mybatis-plus.mapper-locations=classpath:mapper/*.xml
# \u5B9E\u4F53\u7C7B\u522B\u540D\u5305
mybatis-plus.type-aliases-package=cc.bugcat.bre.server.entity
# \u5B57\u6BB5\u683C\u5F0F
mybatis-plus.global-config.db-config.column-format=`%s`
# \u9ED8\u8BA4\u6267\u884C\u5668
mybatis-plus.configuration.default-executor-type=reuse
# \u4E3B\u952E\u81EA\u589E
mybatis-plus.configuration.use-generated-keys=true
# \u5F00\u542F\u4E0B\u5212\u7EBF\u8F6C\u9A7C\u5CF0
mybatis-plus.configuration.map-underscore-to-camel-case=true
