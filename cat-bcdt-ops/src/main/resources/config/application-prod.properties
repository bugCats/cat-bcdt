app.env=prod

#\u7985\u9053\u7F51\u9875\u5730\u5740
zentao.web-host=

#bcdt\u540E\u53F0\u5730\u5740
bcdt.ops-host=

#bcdt-web\u9879\u76EE\u6839\u76EE\u5F55\uFF1B\u5982\u679C\u4E0D\u4F7F\u7528nginx\uFF0C\u53EF\u4EE5\u5728\u6B64\u5904\u914D\u7F6Eweb\u6839\u8DEF\u5F84\uFF0C\u96C6\u6210\u5230\u540E\u7AEF\u9759\u6001\u8D44\u6E90\u670D\u52A1
bcdt.local-path=


mybatis.sql.show=false


# \u6570\u636E\u5E93\u4EE3\u7406
mysql.proxy.enable=true



# ===============================
# \u6570\u636E\u6E90\u914D\u7F6E (MariaDB)
# ===============================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3307/zentao
spring.datasource.username=root
spring.datasource.password=123456Aa;


# Hikari \u8FDE\u63A5\u6C60\uFF08\u8F7B\u91CF\u9AD8\u6027\u80FD\uFF09
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

# 1. \u6C60\u4E2D\u8FDE\u63A5\u6700\u5927\u7A7A\u95F2\u65F6\u95F4\uFF0C\u5FC5\u987B\u5C0F\u4E8Emysql wait_timeout
spring.datasource.hikari.idle-timeout=50000
# 2. \u8FDE\u63A5\u6700\u5927\u751F\u547D\u5468\u671F\uFF0C\u6BD4idle-timeout\u5927\u4E00\u70B9\u5373\u53EF\uFF0C\u5C0F\u4E8E\u6570\u636E\u5E93\u8D85\u65F6
spring.datasource.hikari.max-lifetime=60000
# 3. \u7A7A\u95F2\u8FDE\u63A5\u68C0\u6D4B\uFF1A\u6BCF\u9694\u4E00\u6BB5\u65F6\u95F4\u53D1\u9001\u6D4B\u8BD5SQL\u6821\u9A8C\u8FDE\u63A5\u5B58\u6D3B
spring.datasource.hikari.keepalive-time=30000
# \u7A7A\u95F2\u65F6\u6267\u884C\u7684\u68C0\u6D4B\u8BED\u53E5\uFF0Cmysql\u56FA\u5B9ASELECT 1
spring.datasource.hikari.connection-test-query=SELECT 1
# \u7B49\u5F85\u83B7\u53D6\u8FDE\u63A5\u7684\u6700\u5927\u8D85\u65F6\u65F6\u95F4\uFF08\u4E1A\u52A1\u4E0D\u8981\u8D85\u8FC72s\uFF09
spring.datasource.hikari.connection-timeout=2000
# \u8FDE\u63A5\u83B7\u53D6\u524D\u6821\u9A8C\u6709\u6548\u6027\uFF08\u515C\u5E95\u65B9\u6848\uFF0C\u4F1A\u6709\u6781\u5C0F\u6027\u80FD\u635F\u8017\uFF09
spring.datasource.hikari.validation-timeout=500



